name: Run Weather Script ACII

on:
  workflow_dispatch:  # umožní manuálne spustenie

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker image
        run: docker pull marsur64/weather_kosice_3_days:april_patched_20260413


      - name: Run script and output pocasie.txt
        run: |
          docker run --rm marsur64/weather_kosice_3_days:april_patched_20260413 \
          bash -c "/root/1.sh && cat /root/pocasie.txt"
